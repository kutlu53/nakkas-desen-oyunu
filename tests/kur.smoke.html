<!doctype html><meta charset="utf-8"><title>kur duman testi</title>
<link rel="stylesheet" href="../styles.css">
<style>#out { white-space: pre-wrap; font: 13px/1.4 monospace; background: var(--panel); padding: 12px; border-radius: 8px; }</style>
<pre id="out"></pre>
<main id="app" style="width: 1000px"></main>
<script type="module">
// Sentetik işaretçi olaylarıyla Kalfa/Kur'u baştan sona oynar. Framework yok. Tarayıcıda aç ya da headless --dump-dom ile oku.
import { mount, loadLevels } from "../src/modes/kur.js";
const out = document.getElementById("out"); let fail = 0, n = 0;
window.addEventListener("error", (e) => { out.textContent += "HATA: " + e.message + " @" + (e.filename || "") + ":" + e.lineno + "\n"; });
window.addEventListener("unhandledrejection", (e) => { out.textContent += "HATA (promise): " + (e.reason && e.reason.stack || e.reason) + "\n"; });
const ok = (name, cond) => { n++; out.textContent += (cond ? "✓ " : "✗ ") + name + "\n"; if (!cond) fail++; };
const tick = () => new Promise((r) => setTimeout(r, 0));
const app = document.getElementById("app");

function makeCtx(param, difficulty = "ortaokul") {
  const logs = [];
  return { logs, ctx: { state: { progress: {}, log: [] }, saveState() {}, log: (r) => logs.push(r), go() {}, param, difficulty } };
}
const svg = () => app.querySelector(".board");
const toClient = (bx, by) => { const p = new DOMPoint(bx, by).matrixTransform(svg().getScreenCTM()); return [p.x, p.y]; };
const pev = (type, el, [cx, cy], extra = {}) => el.dispatchEvent(new PointerEvent(type, { clientX: cx, clientY: cy, pointerId: 7, pointerType: "mouse", button: 0, buttons: type === "pointerup" ? 0 : 1, bubbles: true, cancelable: true, ...extra }));
const trayItem = (pred) => [...app.querySelectorAll(".tray-item")].find((b) => pred(b.getAttribute("aria-label")));
const msg = () => app.querySelector(".msg").textContent;
const placedCount = () => app.querySelectorAll(".placed [data-uid]").length;
const overlayOpen = () => !app.querySelector(".overlay").hidden;

/** Kutudan parçayı al, tahtada (bx,by) noktasına bırak. */
async function dragFromTray(label, bx, by, { rotateTimes = 0 } = {}) {
  const b = trayItem((l) => l.startsWith(label)); if (!b) throw new Error("kutuda yok: " + label);
  const tray = app.querySelector(".tray");
  const r = b.getBoundingClientRect();
  pev("pointerdown", b, [r.left + r.width / 2, r.top + r.height / 2]);
  for (let i = 0; i < rotateTimes; i++) window.dispatchEvent(new KeyboardEvent("keydown", { key: "r", bubbles: true }));
  pev("pointermove", tray, toClient(bx - 0.3, by - 0.2));
  pev("pointermove", tray, toClient(bx, by));
  pev("pointerup", tray, toClient(bx, by));
  await tick();
}
/** Tahtadaki parçayı al, (bx,by)'ye ya da tahta dışına bırak. */
async function dragFromBoard(uidIndex, bx, by, { outside = false } = {}) {
  const g = app.querySelectorAll(".placed [data-uid]")[uidIndex];
  const path = g.querySelector("path");
  const bb = path.getBoundingClientRect();
  const start = [bb.left + bb.width / 2, bb.top + bb.height / 2];
  pev("pointerdown", path, start);
  const end = outside ? [-50, -50] : toClient(bx, by);
  pev("pointermove", svg(), end);
  pev("pointerup", svg(), end);
  await tick();
}

// ---------- Seviye 1 (ortaokul): çentiği tanı ----------
{
  const { ctx, logs } = makeCtx("f8-l1");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("seviye 1 kuruldu: tahta + 2 kutu kalemi (haç, kare)", svg() && app.querySelectorAll(".tray-item").length === 2);
  ok("ortaokul: doğru parça kutuda parlar", trayItem((l) => l.startsWith("Sivri uçlu haç")).classList.contains("glow"));
  await dragFromTray("Sivri uçlu haç", 1.04, 0.96);
  ok("haç (1.04,0.96) → yerleşti", placedCount() === 1);
  ok("mesaj: tam oturdu (225 + 135 = 360)", /Tam oturdu/.test(msg()) && /225 \+ 135 = 360/.test(msg()));
  ok("kutuda haç 3 kaldı", /3 adet/.test(trayItem((l) => l.startsWith("Sivri uçlu haç")).getAttribute("aria-label")));
  ok("açı etiketi çizildi (tam)", app.querySelectorAll(".labels .vertex-tam").length >= 3);
  await dragFromTray("Kare (küçük)", -1.24, 0.77);
  ok("kare çentiğe oturdu, 45° açık mesajı", placedCount() === 2 && /45° açık/.test(msg()));
  ok("kare için aile notu (ortaokul) — aynı aileden, not yok", !/sistemden/.test(msg()));
  await dragFromBoard(1, 0, 0, { outside: true });
  ok("kare tahta dışına bırakılınca kutuya döndü", placedCount() === 1 && /kutuya döndü/.test(msg()));
  await dragFromTray("Sivri uçlu haç", 0.3, 0.2);
  ok("yıldızın üstüne bırakılan haç geri zıpladı", placedCount() === 1 && /kutuya döndü/.test(msg()));
  await dragFromTray("Sivri uçlu haç", -1.02, 1.03, { rotateTimes: 1 });
  ok("45° dönük haç yine (−1,1)'e oturdu", placedCount() === 2 && /Tam oturdu/.test(msg()));
  await dragFromTray("Sivri uçlu haç", 1.0, -1.05);
  await dragFromTray("Sivri uçlu haç", -0.97, -1.0);
  ok("4 haç yerleşti", placedCount() === 4);
  ok("seviye tamamlandı: kart açıldı", overlayOpen() && /Oturdu/.test(app.querySelector(".overlay h2").textContent));
  ok("ilerleme kaydedildi", ctx.state.progress["f8-l1"]?.completed === true);
  ok("araştırma logu yazıldı (completed, attempts=6, wrongFamily=0)", logs.length === 1 && logs[0].completed && logs[0].attempts === 6 && logs[0].wrongFamilyAttempts === 0);
  cleanup();
}

// ---------- Seviye 1 (lise): yanıltıcı beşgen, aile notu yok ----------
{
  const { ctx, logs } = makeCtx("f8-l1", "lise");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("lise: kutuda 3 kalem (haç, kare, beşgen)", app.querySelectorAll(".tray-item").length === 3);
  ok("lise: parlama yok", !app.querySelector(".tray-item.glow"));
  ok("lise: etiketler kapalı", app.querySelector("[data-act=labels]").getAttribute("aria-pressed") === "false");
  // 8 kez R: 8·36 = 288°; köşesi çentiğe (0.7071, 0.2929) yakın düşer, çözücü kenarı yıldız kenarına hizalar
  await dragFromTray("Beşgen", 1.4688, 0.5107, { rotateTimes: 8 });
  ok("beşgen çentiğe yapıştı, 27° açık (225 + 108 = 333): " + msg(), placedCount() === 1 && /333/.test(msg()) && /27° açık/.test(msg()));
  ok("lise: aile ipucu verilmez", !/sistemden/.test(msg()));
  cleanup();
  ok("yarım oturum loglandı (completed=false, wrongFamily=1)", logs.length === 1 && logs[0].completed === false && logs[0].wrongFamilyAttempts === 1);
}

// ---------- Seviye 3 (ortaokul 2×2): birim hücreyi ötele ----------
{
  const { ctx } = makeCtx("f8-l3");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("seviye 3: kutuda birim hücre ×3", /Birim hücre, 3 adet/.test(trayItem((l) => l.startsWith("Birim")).getAttribute("aria-label")));
  ok("hayalet kılavuz çizildi", app.querySelectorAll(".ghosts .ghost").length === 6);
  await dragFromTray("Birim hücre", 2.03, 0.02);
  ok("kopya (2,0) kafese oturdu", placedCount() === 2 && /kafese oturdu/.test(msg()));
  await dragFromTray("Birim hücre", 1.0, 0.0);
  ok("kopya (1,0) çakıştı, geri döndü", placedCount() === 2 && /üstüne bindi/.test(msg()));
  await dragFromTray("Birim hücre", -0.02, 2.04);
  await dragFromTray("Birim hücre", 1.98, 2.0);
  ok("2×2 tamam: kart açıldı", placedCount() === 6 && overlayOpen());
  app.querySelector(".overlay [data-act=to-lines]").click(); await tick();
  ok("çizgiye dönüştür: kart kapandı, geçme görünümü açık", !overlayOpen() && svg().classList.contains("lineview") && app.querySelector("[data-act=lines]").getAttribute("aria-pressed") === "true");
  ok("4 yıldız → 8 bant + 32 kesişim parçası", app.querySelectorAll(".lines .band").length === 40 && app.querySelectorAll(".lines .band-edge").length === 40);
  app.querySelector("[data-act=lines]").click(); await tick();
  ok("geçme kapatıldı", !svg().classList.contains("lineview") && app.querySelectorAll(".lines path").length === 0);
  cleanup();
}

// ---------- Seviye 4 (ortaokul 4×2): Tomar birimini aynala ----------
{
  const { ctx, logs } = makeCtx("f8-l4");
  const cleanup = await mount(app, ctx);
  await tick();
  const tiles = () => app.querySelectorAll(".tiles .tile:not(.bad)").length;
  const edge = async (id) => { app.querySelector(`[data-edge=${id}]`).dispatchEvent(new MouseEvent("click", { bubbles: true })); await tick(); };
  ok("seviye 4: tek çeyrek birim, iki kenar tutamacı (sağ, alt)", tiles() === 1 && app.querySelectorAll(".handles [data-edge]").length === 2);
  app.querySelector("[data-act=translate]").click();
  await edge("right");
  ok("çeyreği ötelemek deseni kırar", app.querySelectorAll(".tiles .tile.bad").length === 1 && /kırılır/.test(msg()));
  await new Promise((r) => setTimeout(r, 1800));
  ok("kırık kopya geri alındı", tiles() === 1 && !app.querySelector(".tiles .bad"));
  app.querySelector("[data-act=mirror]").click();
  await edge("right");
  ok("sağdan aynala → 2 birim", tiles() === 2 && /Aynalandı/.test(msg()));
  await edge("bottom");
  ok("alttan aynala → 2×2 birim hücre", tiles() === 4 && /birim hücre var/.test(msg()));
  app.querySelector("[data-act=translate]").click();
  await edge("right");
  ok("birim hücre ötelenince desen bozulmaz → 4×2 doldu", tiles() === 8 && overlayOpen());
  ok("kartta Topkapı Tomarı hikâyesi ve kaynak", /Topkapı Tomarı/.test(app.querySelector(".overlay .story-card h3").textContent) && /Necipoğlu/.test(app.querySelector(".overlay .sc-src").textContent));
  ok("log: brokenCopies=1, attempts=4", logs.length === 1 && logs[0].brokenCopies === 1 && logs[0].attempts === 4);
  cleanup();
}

// ---------- kündekâri kartı seviye 2'ye bağlı ----------
{
  const { loadCards } = await import("../src/cards.js");
  const cards = await loadCards(), l2 = (await loadLevels()).find((l) => l.id === "f8-l2");
  ok("kündekâri kartı var ve seviye 2'ye bağlı", l2.card === "kundekari" && /Kündekâri/.test(cards.kundekari?.title));
}

// ---------- Seviye 0 (ortaokul): pergel ve cetvelle yıldızı kur ----------
{
  const { ctx, logs } = makeCtx("f8-l0");
  const cleanup = await mount(app, ctx);
  await tick();
  const P = (await loadLevels()).find((l) => l.id === "f8-l0").points;
  const task = () => app.querySelector(".task").textContent, fb = () => app.querySelector(".fb").textContent;
  const ptCount = () => app.querySelectorAll(".pts [data-k]").length, objCount = () => app.querySelectorAll(".cons .c-obj").length;
  /** a noktasından b noktasına sürükle (pergel ya da cetvel). */
  async function draw(a, b) {
    const s = svg();
    pev("pointerdown", s, toClient(...P[a]));
    pev("pointermove", s, toClient((P[a][0] + P[b][0]) / 2, (P[a][1] + P[b][1]) / 2));
    pev("pointerup", s, toClient(P[b][0] + 0.02, P[b][1] - 0.02));
    await tick();
  }
  async function tap(k) { pev("pointerdown", svg(), toClient(...P[k])); pev("pointerup", svg(), toClient(...P[k])); await tick(); }
  ok("hazırlık kuruldu: 2 nokta (O, A), adım 1/9", ptCount() === 2 && /Adım 1\/9/.test(task()) && app.querySelectorAll(".steps li").length === 9);
  ok("ortaokul: beklenen noktalar parlar", app.querySelectorAll(".pts .want").length === 2);
  await draw("A", "O");
  ok("pergel ters (uç A'da) → kabul edilmez, ipucu verir", objCount() === 0 && /sivri uç O/.test(fb()));
  await draw("O", "A");
  ok("ana daire çizildi", objCount() === 1 && /Ana daire hazır/.test(fb()) && /Adım 2\/9/.test(task()));
  await tap("O"); await tap("A");
  ok("dokun-dokun ile cetvel: çap çizildi, C açıldı", objCount() === 2 && ptCount() === 3);
  await draw("A", "C");
  ok("dikme yayları: E ve F açıldı", ptCount() === 5);
  app.querySelector("[data-act=show]").click(); await tick();
  ok("usta gösterdi: dik çap, B ve D açıldı", ptCount() === 7 && /Usta çizdi/.test(fb()));
  await draw("A", "O");
  ok("dört daire: G H I J açıldı", ptCount() === 11 && objCount() === 9);
  await draw("I", "G");
  ok("köşegenler: daire 8'e bölündü", ptCount() === 15);
  await draw("A", "C");
  ok("A–C kare kenarı değil → kabul edilmez", /Adım 7\/9/.test(task()));
  await draw("B", "A"); await draw("K", "L");
  ok("iki kare çizildi (8 kenar)", app.querySelectorAll(".cons .c-seg").length === 8 && /Adım 9\/9/.test(task()));
  pev("pointerdown", svg(), toClient(0.3, 0.1)); await tick();
  ok("yıldız boyandı, haç kılavuzu J'de, 135° etiketi", app.querySelector(".fill [data-piece-id=sekiz-kose-yildiz]") && app.querySelector(".fill .ghost") && /135°/.test(app.querySelector(".fill text").textContent));
  await new Promise((r) => setTimeout(r, 1600));
  ok("kart açıldı, sonraki seviye f8-l1", overlayOpen() && app.querySelector(".overlay .btn.primary").getAttribute("href") === "#kur/f8-l1");
  ok("ilerleme + log (wrongPicks=2, hints=1)", ctx.state.progress["f8-l0"]?.completed && logs.length === 1 && logs[0].wrongPicks === 2 && logs[0].hintsUsed === 1);
  cleanup();
}

// ---------- seviye listesi: hazırlık ✎ ile başlar ----------
{
  const { ctx } = makeCtx(undefined);
  await mount(app, ctx); await tick();
  const first = app.querySelector(".level");
  ok("listede ilk kart ✎ Pergelle kur", first.getAttribute("href") === "#kur/f8-l0" && first.querySelector(".num").textContent === "✎");
}

out.textContent += fail ? `\n${fail}/${n} test başarısız` : `\n${n} test, hepsi geçti`;
</script>
