<!doctype html><meta charset="utf-8"><title>kur duman testi</title>
<link rel="stylesheet" href="../styles.css">
<style>#out { white-space: pre-wrap; font: 13px/1.4 monospace; background: var(--panel); padding: 12px; border-radius: 8px; }</style>
<pre id="out"></pre>
<main id="app" style="width: 1000px"></main>
<script type="module">
// Sentetik işaretçi olaylarıyla Kalfa/Kur'u baştan sona oynar. Framework yok. Tarayıcıda aç ya da headless --dump-dom ile oku.
import { mount, loadLevels } from "../src/modes/kur.js";
const out = document.getElementById("out"); let fail = 0, n = 0;
window.addEventListener("error", (e) => { out.textContent += "HATA: " + e.message + " @" + (e.filename || "") + ":" + e.lineno + "\n"; });
window.addEventListener("unhandledrejection", (e) => { out.textContent += "HATA (promise): " + (e.reason && e.reason.stack || e.reason) + "\n"; });
const ok = (name, cond) => { n++; out.textContent += (cond ? "✓ " : "✗ ") + name + "\n"; if (!cond) fail++; };
const tick = () => new Promise((r) => setTimeout(r, 0));
const app = document.getElementById("app");

function makeCtx(param, difficulty = "ortaokul") {
  const logs = [];
  return { logs, ctx: { state: { progress: {}, log: [] }, saveState() {}, log: (r) => logs.push(r), go() {}, param, difficulty } };
}
const svg = () => app.querySelector(".board");
const toClient = (bx, by) => { const p = new DOMPoint(bx, by).matrixTransform(svg().getScreenCTM()); return [p.x, p.y]; };
const pev = (type, el, [cx, cy], extra = {}) => el.dispatchEvent(new PointerEvent(type, { clientX: cx, clientY: cy, pointerId: 7, pointerType: "mouse", button: 0, buttons: type === "pointerup" ? 0 : 1, bubbles: true, cancelable: true, ...extra }));
const trayItem = (pred) => [...app.querySelectorAll(".tray-item")].find((b) => pred(b.getAttribute("aria-label")));
const msg = () => app.querySelector(".msg").textContent;
const placedCount = () => app.querySelectorAll(".placed [data-uid]").length;
const overlayOpen = () => !app.querySelector(".overlay").hidden;

/** Kutudan parçayı al, tahtada (bx,by) noktasına bırak. */
async function dragFromTray(label, bx, by, { rotateTimes = 0 } = {}) {
  const b = trayItem((l) => l.startsWith(label)); if (!b) throw new Error("kutuda yok: " + label);
  const tray = app.querySelector(".tray");
  const r = b.getBoundingClientRect();
  pev("pointerdown", b, [r.left + r.width / 2, r.top + r.height / 2]);
  for (let i = 0; i < rotateTimes; i++) window.dispatchEvent(new KeyboardEvent("keydown", { key: "r", bubbles: true }));
  pev("pointermove", tray, toClient(bx - 0.3, by - 0.2));
  pev("pointermove", tray, toClient(bx, by));
  pev("pointerup", tray, toClient(bx, by));
  await tick();
}
/** Tahtadaki parçayı al, (bx,by)'ye ya da tahta dışına bırak. */
async function dragFromBoard(uidIndex, bx, by, { outside = false } = {}) {
  const g = app.querySelectorAll(".placed [data-uid]")[uidIndex];
  const path = g.querySelector("path");
  const bb = path.getBoundingClientRect();
  const start = [bb.left + bb.width / 2, bb.top + bb.height / 2];
  pev("pointerdown", path, start);
  const end = outside ? [-50, -50] : toClient(bx, by);
  pev("pointermove", svg(), end);
  pev("pointerup", svg(), end);
  await tick();
}

// ---------- Seviye 1 (ortaokul): çentiği tanı ----------
{
  const { ctx, logs } = makeCtx("f8-l1");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("seviye 1 kuruldu: tahta + 2 kutu kalemi (haç, kare)", svg() && app.querySelectorAll(".tray-item").length === 2);
  ok("ortaokul: doğru parça kutuda parlar", trayItem((l) => l.startsWith("Sivri uçlu haç")).classList.contains("glow"));
  await dragFromTray("Sivri uçlu haç", 1.04, 0.96);
  ok("haç (1.04,0.96) → yerleşti", placedCount() === 1);
  ok("mesaj: tam oturdu (225 + 135 = 360)", /Tam oturdu/.test(msg()) && /225 \+ 135 = 360/.test(msg()));
  ok("kutuda haç 3 kaldı", /3 adet/.test(trayItem((l) => l.startsWith("Sivri uçlu haç")).getAttribute("aria-label")));
  ok("açı etiketi çizildi (tam)", app.querySelectorAll(".labels .vertex-tam").length >= 3);
  await dragFromTray("Kare (küçük)", -1.24, 0.77);
  ok("kare çentiğe oturdu, 45° açık mesajı", placedCount() === 2 && /45° açık/.test(msg()));
  ok("kare için aile notu (ortaokul) — aynı aileden, not yok", !/sistemden/.test(msg()));
  await dragFromBoard(1, 0, 0, { outside: true });
  ok("kare tahta dışına bırakılınca kutuya döndü", placedCount() === 1 && /kutuya döndü/.test(msg()));
  await dragFromTray("Sivri uçlu haç", 0.3, 0.2);
  ok("yıldızın üstüne bırakılan haç geri zıpladı", placedCount() === 1 && /kutuya döndü/.test(msg()));
  await dragFromTray("Sivri uçlu haç", -1.02, 1.03, { rotateTimes: 1 });
  ok("45° dönük haç yine (−1,1)'e oturdu", placedCount() === 2 && /Tam oturdu/.test(msg()));
  await dragFromTray("Sivri uçlu haç", 1.0, -1.05);
  await dragFromTray("Sivri uçlu haç", -0.97, -1.0);
  ok("4 haç yerleşti", placedCount() === 4);
  ok("seviye tamamlandı: kart açıldı", overlayOpen() && /Oturdu/.test(app.querySelector(".overlay h2").textContent));
  ok("ilerleme kaydedildi", ctx.state.progress["f8-l1"]?.completed === true);
  ok("araştırma logu yazıldı (completed, attempts=6, wrongFamily=0)", logs.length === 1 && logs[0].completed && logs[0].attempts === 6 && logs[0].wrongFamilyAttempts === 0);
  cleanup();
}

// ---------- çocuk yanıltıcı kareyi tahtanın boş bir yerinde bırakır, haçları koyar, sonra kareyi çıkarır ----------
{
  const { ctx } = makeCtx("f8-l1");
  const cleanup = await mount(app, ctx); await tick();
  await dragFromTray("Kare (küçük)", 2.6, -1.6); // tahtanın boş köşesine bırakır; hiçbir haçın yolunu kesmez
  ok("fazla parça: kare boş köşede kaldı: " + msg(), placedCount() === 1);
  for (const [x, y, r] of [[1.04, 0.96, 0], [-1.02, 1.03, 1], [1.0, -1.05, 0], [-0.97, -1.0, 0]]) await dragFromTray("Sivri uçlu haç", x, y, { rotateTimes: r });
  const m = msg();
  ok("fazla parça: haçlar bitince oyun fazla parçayı söyler: " + m, placedCount() >= 4 && !overlayOpen() && /fazla|desene ait olmayan/.test(m));
  const sq = [...app.querySelectorAll(".placed [data-uid]")].find((g) => /Kare/.test(g.getAttribute("aria-label")));
  if (sq) { const bb = sq.querySelector("path").getBoundingClientRect(); pev("pointerdown", sq.querySelector("path"), [bb.left + bb.width / 2, bb.top + bb.height / 2]); pev("pointermove", svg(), [-50, -50]); pev("pointerup", svg(), [-50, -50]); await tick(); }
  ok("fazla parça: kare kutuya dönünce seviye biter", overlayOpen());
  cleanup();
}

// ---------- klavyeyle oynama: kutuda Enter, oklarla taşı, Enter bırak ----------
{
  const { ctx } = makeCtx("f8-l1");
  const cleanup = await mount(app, ctx); await tick();
  const [vx, vy, vw, vh] = svg().getAttribute("viewBox").split(" ").map(Number);
  const key = (k, extra = {}) => window.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, ...extra }));
  const item = trayItem((l) => l.startsWith("Sivri uçlu haç"));
  item.focus(); item.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true })); await tick();
  ok("klavye: Enter ile parça alındı, yönerge verildi", /ok tuşları/.test(msg()));
  // merkezden (1, 1)'e: 0,1'lik adımlarla
  let x = vx + vw / 2, y = vy + vh / 2;
  while (x < 0.95) { key("ArrowRight"); x += 0.1; } while (x > 1.05) { key("ArrowLeft"); x -= 0.1; }
  while (y < 0.95) { key("ArrowDown"); y += 0.1; } while (y > 1.05) { key("ArrowUp"); y -= 0.1; }
  key("Enter"); await tick();
  ok("klavye: Enter ile bırakıldı, haç çentiğe oturdu: " + msg(), placedCount() === 1 && /Tam oturdu/.test(msg()));
  const placed = app.querySelector(".placed [data-uid]");
  placed.focus(); placed.dispatchEvent(new KeyboardEvent("keydown", { key: "Delete", bubbles: true })); await tick();
  ok("klavye: tahtadaki parça Delete ile kutuya döndü", placedCount() === 0 && /4 adet/.test(trayItem((l) => l.startsWith("Sivri uçlu haç")).getAttribute("aria-label")));
  cleanup();
}

// ---------- Seviye 1 (lise): yanıltıcı beşgen, aile notu yok ----------
{
  const { ctx, logs } = makeCtx("f8-l1", "lise");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("lise: kutuda 3 kalem (haç, kare, beşgen)", app.querySelectorAll(".tray-item").length === 3);
  ok("lise: parlama yok", !app.querySelector(".tray-item.glow"));
  ok("lise: etiketler kapalı", app.querySelector("[data-act=labels]").getAttribute("aria-pressed") === "false");
  // 8 kez R: 8·36 = 288°; köşesi çentiğe (0.7071, 0.2929) yakın düşer, çözücü kenarı yıldız kenarına hizalar
  await dragFromTray("Beşgen", 0.9866, 0.3837, { rotateTimes: 8 });
  ok("beşgen çentiğe yapıştı, 27° açık (225 + 108 = 333): " + msg(), placedCount() === 1 && /333/.test(msg()) && /27° açık/.test(msg()));
  ok("lise: aile ipucu verilmez", !/sistemden/.test(msg()));
  cleanup();
  ok("yarım oturum loglandı (completed=false, wrongFamily=1)", logs.length === 1 && logs[0].completed === false && logs[0].wrongFamilyAttempts === 1);
}

// ---------- Seviye 3 (ortaokul 2×2): birim hücreyi ötele ----------
{
  const { ctx } = makeCtx("f8-l3");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("seviye 3: kutuda birim hücre ×3", /Birim hücre, 3 adet/.test(trayItem((l) => l.startsWith("Birim")).getAttribute("aria-label")));
  ok("hayalet kılavuz çizildi", app.querySelectorAll(".ghosts .ghost").length === 6);
  await dragFromTray("Birim hücre", 2.03, 0.02);
  ok("kopya (2,0) kafese oturdu", placedCount() === 2 && /kafese oturdu/.test(msg()));
  await dragFromTray("Birim hücre", 1.0, 0.0);
  ok("kopya (1,0) çakıştı, geri döndü", placedCount() === 2 && /üstüne bindi/.test(msg()));
  await dragFromTray("Birim hücre", -0.02, 2.04);
  await dragFromTray("Birim hücre", 1.98, 2.0);
  ok("2×2 tamam: kart açıldı", placedCount() === 6 && overlayOpen());
  app.querySelector(".overlay [data-act=to-lines]").click(); await tick();
  ok("çizgiye dönüştür: kart kapandı, geçme görünümü açık", !overlayOpen() && svg().classList.contains("lineview") && app.querySelector("[data-act=lines]").getAttribute("aria-pressed") === "true");
  ok("4 yıldız → 8 bant + 32 kesişim parçası", app.querySelectorAll(".lines .band").length === 40 && app.querySelectorAll(".lines .band-edge").length === 40);
  app.querySelector("[data-act=lines]").click(); await tick();
  ok("geçme kapatıldı", !svg().classList.contains("lineview") && app.querySelectorAll(".lines path").length === 0);
  cleanup();
}

// ---------- Seviye 4 (ortaokul 4×2): Tomar birimini aynala ----------
{
  const { ctx, logs } = makeCtx("f8-l4");
  const cleanup = await mount(app, ctx);
  await tick();
  const tiles = () => app.querySelectorAll(".tiles .tile:not(.bad)").length;
  const edge = async (id) => { app.querySelector(`[data-edge=${id}]`).dispatchEvent(new MouseEvent("click", { bubbles: true })); await tick(); };
  ok("seviye 4: tek çeyrek birim, iki kenar tutamacı (sağ, alt)", tiles() === 1 && app.querySelectorAll(".handles [data-edge]").length === 2);
  app.querySelector("[data-act=translate]").click();
  await edge("right");
  ok("çeyreği ötelemek deseni kırar", app.querySelectorAll(".tiles .tile.bad").length === 1 && /kırılır/.test(msg()));
  await new Promise((r) => setTimeout(r, 1800));
  ok("kırık kopya geri alındı", tiles() === 1 && !app.querySelector(".tiles .bad"));
  app.querySelector("[data-act=mirror]").click();
  await edge("right");
  ok("sağdan aynala → 2 birim", tiles() === 2 && /Aynalandı/.test(msg()));
  await edge("bottom");
  ok("alttan aynala → 2×2 birim hücre", tiles() === 4 && /birim hücre var/.test(msg()));
  app.querySelector("[data-act=translate]").click();
  await edge("right");
  ok("birim hücre ötelenince desen bozulmaz → 4×2 doldu", tiles() === 8 && overlayOpen());
  ok("kartta Topkapı Tomarı hikâyesi ve kaynak", /Topkapı Tomarı/.test(app.querySelector(".overlay .story-card h3").textContent) && /Necipoğlu/.test(app.querySelector(".overlay .sc-src").textContent));
  ok("log: brokenCopies=1, attempts=4", logs.length === 1 && logs[0].brokenCopies === 1 && logs[0].attempts === 4);
  cleanup();
}

// ---------- Seviye 5 (ortaokul): bozuk çini ----------
{
  const { ctx, logs } = makeCtx("f8-l5");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("seviye 5: 9 sabit parça, kutuda 4 kalem (8'li yıldız, haç, 10'lu yıldız, kare)", app.querySelectorAll(".fixed .piece").length === 9 && app.querySelectorAll(".tray-item").length === 4);
  ok("ortaokul: 10'lu yıldız parlamaz, 8'li parlar", !trayItem((l) => l.startsWith("On köşeli")).classList.contains("glow") && trayItem((l) => l.startsWith("Sekiz köşeli")).classList.contains("glow"));
  await dragFromTray("On köşeli", 0.03, 0.02);
  const tenMsg = msg();
  ok("10'lu yıldız boşluğa sığmadı, kutuya döndü: " + tenMsg, placedCount() === 0 && /90 \+ 90 \+ 90 \+ 72 = 342/.test(tenMsg) && /90° istiyor/.test(tenMsg) && /onlu sistemden/.test(tenMsg));
  await dragFromTray("Sekiz köşeli", 0.04, -0.03);
  ok("8'li yıldız ortadaki boşluğa oturdu", placedCount() === 1 && /Tam oturdu/.test(msg()));
  await dragFromTray("Sivri uçlu haç", 1.05, -0.97);
  await dragFromTray("Sekiz köşeli", -1.97, 2.03);
  await dragFromTray("Sekiz köşeli", 2.02, 1.96);
  ok("dört eksik yerleşti: kart açıldı", placedCount() === 4 && overlayOpen());
  ok("log: wrongFamily=1", logs.length === 1 && logs[0].wrongFamilyAttempts === 1);
  cleanup();
}

{
  const { ctx } = makeCtx("f8-l5", "lise");
  const cleanup = await mount(app, ctx);
  await tick();
  await dragFromTray("On iki köşeli", 0.03, 0.02);
  ok("lise: 12'li yıldız 330 ile reddedilir, aile notu yok: " + msg(), placedCount() === 0 && /90 \+ 90 \+ 90 \+ 60 = 330/.test(msg()) && !/sistemden/.test(msg()));
  cleanup();
}

// ---------- 10'lu aile: pergel hazırlığı (usta gösterir) ----------
{
  const { ctx } = makeCtx("f10-l0");
  const cleanup = await mount(app, ctx);
  await tick();
  ok("f10-l0: 12 adım, başta O ve A", app.querySelectorAll(".steps li").length === 12 && app.querySelectorAll(".pts [data-k]").length === 2);
  for (let i = 0; i < 11; i++) { app.querySelector("[data-act=show]").click(); await tick(); }
  ok("f10-l0: ongen tamam (19 nokta), 10 kiriş", app.querySelectorAll(".pts [data-k]").length === 19 && app.querySelectorAll(".cons .c-seg").length === 10);
  app.querySelector("[data-act=show]").click(); await tick();
  ok("f10-l0: yıldız boyandı, beşgen kılavuzu, 108° etiketi", app.querySelector(".fill [data-piece-id=on-kose-yildiz]") && app.querySelector(".fill .ghost") && app.querySelector(".fill text").textContent === "108°");
  await new Promise((r) => setTimeout(r, 1600));
  ok("f10-l0: kart açıldı, sonraki f10-l1", overlayOpen() && app.querySelector(".overlay .btn.primary").getAttribute("href") === "#kur/f10-l1");
  cleanup();
}

// ---------- 10'lu aile, seviye 1: on beşgen ----------
{
  const { ctx, logs } = makeCtx("f10-l1");
  const cleanup = await mount(app, ctx);
  await tick();
  const T = (await loadLevels()).find((l) => l.id === "f10-l1").targets;
  ok("f10-l1: kutuda beşgen ×10 ve kare", /Beşgen, 10 adet/.test(trayItem((l) => l.startsWith("Beşgen")).getAttribute("aria-label")) && trayItem((l) => l.startsWith("Kare (küçük)")));
  await dragFromTray("Kare (küçük)", T[0].x * 0.9, T[0].y * 0.9);
  ok("f10-l1: kare sığmaz, kutuya döner, anlamsız açı yazmaz: " + msg(), placedCount() === 0 && /kutuya döndü/.test(msg()) && !/288° istiyor/.test(msg()) && /sekizli sistemden/.test(msg()));
  await dragFromTray("Beşgen", T[0].x + 0.04, T[0].y - 0.03);
  ok("f10-l1: beşgen (döndürmeden) çentiğe oturdu, 252 + 108 = 360: " + msg(), placedCount() === 1 && /252 \+ 108 = 360/.test(msg()));
  for (const t of T.slice(1)) await dragFromTray("Beşgen", t.x + 0.03, t.y + 0.03);
  ok("f10-l1: on beşgen yerleşti, kart açıldı", placedCount() === 10 && overlayOpen());
  ok("f10-l1: log wrongFamily=1", logs.length === 1 && logs[0].wrongFamilyAttempts === 1);
  cleanup();
}

// ---------- 10'lu aile, seviye 2–4: kesin desen; parçalar kutudan 0° dönüşle bırakılır ----------
{
  const LV = await loadLevels();
  for (const id of ["f10-l2", "f10-l4"]) {
    const { ctx, logs } = makeCtx(id);
    const cleanup = await mount(app, ctx);
    await tick();
    const lv = LV.find((l) => l.id === id), names = { papyon: "Papyon", "dortgen-10": "Dörtgen (10'lu)", besgen: "Beşgen", "on-kose-yildiz": "On köşeli" };
    if (id === "f10-l4") {
      const hole = lv.targets.find((t) => t.pieceId === "on-kose-yildiz");
      await dragFromTray("Sekiz köşeli", hole.x + 0.02, hole.y + 0.02);
      ok(`${id}: 8'li yıldız sığmaz, açıyla söylenir: ` + msg(), placedCount() === 0 && /kutuya döndü/.test(msg()) && /sekizli sistemden/.test(msg()));
    }
    // öğrencinin yapacağı gibi: önce papyon, sonra dörtgenler, en son beşgenler; papyon ve dörtgen R ile hedef açıya döndürülür
    const order = { "on-kose-yildiz": 0, papyon: 1, "dortgen-10": 2, besgen: 3 };
    const miss = [];
    for (const t of [...lv.targets].sort((p, q) => order[p.pieceId] - order[q.pieceId])) {
      const before = placedCount();
      const turns = t.pieceId === "besgen" || t.pieceId === "on-kose-yildiz" ? 0 : Math.round(t.rot / 36) % 10;
      await dragFromTray(names[t.pieceId], t.x + 0.02, t.y - 0.015, { rotateTimes: turns });
      if (placedCount() !== before + 1 || !/Tam oturdu/.test(msg())) miss.push(`${t.pieceId}@${t.rot}: ${msg()}`);
    }
    ok(`${id}: ${lv.targets.length} hedefin hepsi oturdu (papyon/dörtgen R ile döndürüldü)` + (miss.length ? " — " + miss.join(" | ") : ""), miss.length === 0);
    ok(`${id}: kart açıldı`, overlayOpen());
    cleanup();
  }
  {
    const { ctx } = makeCtx("f10-l3");
    const cleanup = await mount(app, ctx);
    await tick();
    const { a, b } = LV.find((l) => l.id === "f10-l3").translation;
    ok("f10-l3: kutuda birim hücre ×3", /Birim hücre, 3 adet/.test(trayItem((l) => l.startsWith("Birim")).getAttribute("aria-label")));
    await dragFromTray("Birim hücre", a[0] + 0.03, a[1] - 0.02);
    ok("f10-l3: kopya a'ya oturdu", /kafese oturdu/.test(msg()));
    await dragFromTray("Birim hücre", b[0] - 0.02, b[1] + 0.03);
    await dragFromTray("Birim hücre", a[0] + b[0] + 0.02, a[1] + b[1] + 0.02);
    ok("f10-l3: 2×2 tamam, kart açıldı", overlayOpen());
    cleanup();
  }
}

// ---------- 6'lı aile: hazırlık + 4 seviye; parçalar kutudan 0° ile bırakılır ----------
{
  const LV = await loadLevels();
  {
    const { ctx } = makeCtx("f6-l0");
    const cleanup = await mount(app, ctx); await tick();
    ok("f6-l0: 7 adım", app.querySelectorAll(".steps li").length === 7);
    for (let i = 0; i < 7; i++) { app.querySelector("[data-act=show]").click(); await tick(); }
    ok("f6-l0: daire altıya bölündü (7 nokta), 6 kenar, 120° etiketi", app.querySelectorAll(".pts [data-k]").length === 7 && app.querySelectorAll(".cons .c-seg").length === 6 && app.querySelector(".fill text").textContent === "120°");
    await new Promise((r) => setTimeout(r, 1600));
    ok("f6-l0: kart açıldı, sonraki f6-l1", overlayOpen() && app.querySelector(".overlay .btn.primary").getAttribute("href") === "#kur/f6-l1");
    cleanup();
  }
  const names = { altigen: "Düzgün altıgen", "alti-kose-yildiz": "Altı köşeli" };
  for (const id of ["f6-l1", "f6-l2", "f6-l4"]) {
    const { ctx, logs } = makeCtx(id);
    const cleanup = await mount(app, ctx); await tick();
    const lv = LV.find((l) => l.id === id);
    if (id === "f6-l4") {
      const hole = lv.targets.find((t) => t.pieceId === "alti-kose-yildiz");
      await dragFromTray("Sekiz köşeli", hole.x + 0.02, hole.y + 0.02);
      ok(`${id}: 8'li yıldız sığmaz: ` + msg(), placedCount() === 0 && /kutuya döndü/.test(msg()));
    }
    const miss = [];
    for (const t of [...lv.targets].sort((p, q) => (p.pieceId === "alti-kose-yildiz" ? -1 : 0) - (q.pieceId === "alti-kose-yildiz" ? -1 : 0))) {
      const before = placedCount();
      await dragFromTray(names[t.pieceId], t.x + 0.02, t.y - 0.015);
      if (placedCount() !== before + 1 || !/Tam oturdu/.test(msg())) miss.push(`${t.pieceId}@${t.rot}: ${msg()}`);
    }

// ---------- 12'li aile, 3.4.6.4: parçalar R ile hedef açıya döndürülür ----------
{
  const LV = await loadLevels(), names = { "kare-12": "Kare (12'li)", "ucgen-12": "Üçgen (12'li)", "altigen-12": "Altıgen (12'li)" };
  const order = { "altigen-12": 0, "kare-12": 1, "ucgen-12": 2 };
  for (const id of ["f12-l2", "f12-l4"]) {
    const { ctx } = makeCtx(id);
    const cleanup = await mount(app, ctx); await tick();
    const lv = LV.find((l) => l.id === id);
    if (id === "f12-l4") {
      const hole = lv.targets.find((t) => t.pieceId === "altigen-12");
      await dragFromTray("Beşgen", hole.x + 0.02, hole.y + 0.01);
      const m = msg();
      ok(`${id}: beşgen altıgen boşluğuna uymaz: ` + m, (placedCount() === 0 && /kutuya döndü/.test(m)) || /açık kaldı/.test(m));
      if (placedCount()) await dragFromBoard(0, 0, 0, { outside: true });
    }
    const miss = [];
    for (const t of [...lv.targets].sort((p, q) => order[p.pieceId] - order[q.pieceId])) {
      const before = placedCount();
      await dragFromTray(names[t.pieceId], t.x + 0.01, t.y - 0.01, { rotateTimes: Math.round(t.rot / 30) % 12 });
      // f12-l2'de altıgenin kenarına konan ilk kareler henüz köşe tamamlamaz ("açık kaldı" doğrudur); yerleşme yeter
      if (placedCount() !== before + 1 || (id !== "f12-l2" && !/Tam oturdu/.test(msg()))) miss.push(`${t.pieceId}@${t.rot}: ${msg()}`);
    }
    ok(`${id}: ${lv.targets.length} hedef oturdu` + (miss.length ? " — " + miss.join(" | ") : ""), miss.length === 0);
    ok(`${id}: kart açıldı`, overlayOpen());
    cleanup();
  }
  {
    const { ctx } = makeCtx("f12-l3");
    const cleanup = await mount(app, ctx); await tick();
    const { a, b } = LV.find((l) => l.id === "f12-l3").translation;
    await dragFromTray("Birim hücre", a[0] + 0.02, a[1] - 0.01);
    ok("f12-l3: kopya a'ya oturdu", /kafese oturdu/.test(msg()));
    await dragFromTray("Birim hücre", b[0] - 0.01, b[1] + 0.02);
    await dragFromTray("Birim hücre", a[0] + b[0] + 0.01, a[1] + b[1] + 0.01);
    ok("f12-l3: 2×2 tamam, kart açıldı", overlayOpen());
    cleanup();
  }
}

// ---------- Seviye 0 (ortaokul): pergel ve cetvelle yıldızı kur ----------
{
  const { ctx, logs } = makeCtx("f8-l0");
  const cleanup = await mount(app, ctx);
  await tick();
  const P = (await loadLevels()).find((l) => l.id === "f8-l0").points;
  const task = () => app.querySelector(".task").textContent, fb = () => app.querySelector(".fb").textContent;
  const ptCount = () => app.querySelectorAll(".pts [data-k]").length, objCount = () => app.querySelectorAll(".cons .c-obj").length;
  /** a noktasından b noktasına sürükle (pergel ya da cetvel). */
  async function draw(a, b) {
    const s = svg();
    pev("pointerdown", s, toClient(...P[a]));
    pev("pointermove", s, toClient((P[a][0] + P[b][0]) / 2, (P[a][1] + P[b][1]) / 2));
    pev("pointerup", s, toClient(P[b][0] + 0.02, P[b][1] - 0.02));
    await tick();
  }
  async function tap(k) { pev("pointerdown", svg(), toClient(...P[k])); pev("pointerup", svg(), toClient(...P[k])); await tick(); }
  ok("hazırlık kuruldu: 2 nokta (O, A), adım 1/9", ptCount() === 2 && /Adım 1\/9/.test(task()) && app.querySelectorAll(".steps li").length === 9);
  ok("ortaokul: beklenen noktalar parlar", app.querySelectorAll(".pts .want").length === 2);
  await draw("A", "O");
  ok("pergel ters (uç A'da) → kabul edilmez, ipucu verir", objCount() === 0 && /sivri uç O/.test(fb()));
  await draw("O", "A");
  ok("ana daire çizildi", objCount() === 1 && /Ana daire hazır/.test(fb()) && /Adım 2\/9/.test(task()));
  await tap("O"); await tap("A");
  ok("dokun-dokun ile cetvel: çap çizildi, C açıldı", objCount() === 2 && ptCount() === 3);
  await draw("A", "C");
  ok("dikme yayları: E ve F açıldı", ptCount() === 5);
  app.querySelector("[data-act=show]").click(); await tick();
  ok("usta gösterdi: dik çap, B ve D açıldı", ptCount() === 7 && /Usta çizdi/.test(fb()));
  await draw("A", "O");
  ok("dört daire: G H I J açıldı", ptCount() === 11 && objCount() === 9);
  await draw("I", "G");
  ok("köşegenler: daire 8'e bölündü", ptCount() === 15);
  await draw("A", "C");
  ok("A–C kare kenarı değil → kabul edilmez", /Adım 7\/9/.test(task()));
  await draw("B", "A"); await draw("K", "L");
  ok("iki kare çizildi (8 kenar)", app.querySelectorAll(".cons .c-seg").length === 8 && /Adım 9\/9/.test(task()));
  pev("pointerdown", svg(), toClient(0.3, 0.1)); await tick();
  ok("yıldız boyandı, haç kılavuzu J'de, 135° etiketi", app.querySelector(".fill [data-piece-id=sekiz-kose-yildiz]") && app.querySelector(".fill .ghost") && /135°/.test(app.querySelector(".fill text").textContent));
  await new Promise((r) => setTimeout(r, 1600));
  ok("kart açıldı, sonraki seviye f8-l1", overlayOpen() && app.querySelector(".overlay .btn.primary").getAttribute("href") === "#kur/f8-l1");
  ok("ilerleme + log (wrongPicks=2, hints=1)", ctx.state.progress["f8-l0"]?.completed && logs.length === 1 && logs[0].wrongPicks === 2 && logs[0].hintsUsed === 1);
  cleanup();
}
